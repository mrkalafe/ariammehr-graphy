<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله | آریامهر گرافی</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #101114;
            color: #fff;
            font-family: Tahoma, sans-serif;
            line-height: 2;
        }

        header {
            text-align: center;
            padding: 25px 10px;
            border-bottom: 1px solid #b99750;
        }

        header h1 {
            color: #d5b56b;
        }

        header a {
            color: #d5b56b;
            text-decoration: none;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
        }

        #cover {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
        }

        #title {
            color: #d5b56b;
            font-size: 30px;
            margin-top: 25px;
        }

        #description {
            color: #aaa;
            font-size: 17px;
        }

        #content {
            margin-top: 35px;
            font-size: 16px;
            line-height: 2.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message {
            text-align: center;
            color: #aaa;
            padding: 40px 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            #title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>آریامهر گرافی</h1>
        <a href="index.html">بازگشت به صفحه اصلی</a>
    </header>

    <main id="article">
        <p class="message">در حال دریافت مقاله...</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://dtndnnogjrtufjezwety.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Z3VyIdDrg5Rdrg9REKRqZw_oUSVG04a";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadArticle() {
            const container = document.getElementById("article");
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                container.innerHTML = '<p class="message">شناسه مقاله مشخص نیست.</p>';
                return;
            }

            const { data, error } = await db
                .from("articles")
                .select("id, title, description, content, cover_image, status")
                .eq("id", id)
                .eq("status", "published")
                .single();

            if (error || !data) {
                console.error("Article loading error:", error);
                container.innerHTML = '<p class="message">مقاله موردنظر پیدا نشد یا منتشر نشده است.</p>';
                return;
            }

            document.title = data.title + " | آریامهر گرافی";

            container.innerHTML = "";

            if (data.cover_image) {
                const cover = document.createElement("img");
                cover.id = "cover";
                cover.alt = data.title || "تصویر مقاله";
                cover.src = data.cover_image;
                cover.style.display = "block";
                container.appendChild(cover);
            }

            const title = document.createElement("h1");
            title.id = "title";
            title.textContent = data.title || "";
            container.appendChild(title);

            const description = document.createElement("p");
            description.id = "description";
            description.textContent = data.description || "";
            container.appendChild(description);

            const content = document.createElement("div");
            content.id = "content";
            content.textContent = data.content || "";
            container.appendChild(content);
        }

        loadArticle().catch(function(error) {
            console.error("Unexpected error:", error);
            document.getElementById("article").innerHTML =
                '<p class="message">در دریافت مقاله مشکلی پیش آمد. لطفاً صفحه را دوباره بارگذاری کنید.</p>';
        });
    </script>

</body>
</html>
