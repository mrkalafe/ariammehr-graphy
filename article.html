\<script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)">\</script>

\<script>     const SUPABASE_URL = "[https://dtndnnogjrtufjezwety.supabase.co](https://dtndnnogjrtufjezwety.supabase.co)";     const SUPABASE_KEY = "sb_publishable_Z3VyIdDrg5Rdrg9REKRqZw_oUSVG04a";      const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);      async function loadArticle() {          const params = new URLSearchParams(window\.location.search);         const id = params.get("id");          const container = document.getElementById("article");          if (!id) {             container.innerHTML = '\<p class="message">شناسه مقاله مشخص نیست.\</p>';             return;         }          const { data, error } = await db             .from("articles")             .select("\*")             .eq("id", id)             .eq("status", "published")             .single();          if (error || !data) {             container.innerHTML = '\<p class="message">مقاله موردنظر پیدا نشد.\</p>';             return;         }          document.title = data.title + " | آریامهر گرافی";          container.innerHTML = \`             ${data.cover_image ? '\<img id="cover" src="" alt="">' : ''}              \<h1 id="title">\</h1>              \<p id="description">\</p>              \<div id="content">\</div>         \`;          if (data.cover_image) {             const cover = document.getElementById("cover");             cover.src = data.cover_image;             cover.style.display = "block";         }          document.getElementById("title").textContent = data.title;         document.getElementById("description").textContent = data.description || "";         document.getElementById("content").textContent = data.content || "";     }      loadArticle(); \</script>
