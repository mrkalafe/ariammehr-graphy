<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a1a1a"><title>پروفایل کاربر | آریامهر گرافی</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/lucide@latest"></script><style>:root{color-scheme:dark;--bg:#1a1a1a;--surface:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--text:#fff;--muted:#b8bdc5;--red:#ed2a49;--gold:#d3a034}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 5%,rgba(42,138,207,.14),transparent 35rem),radial-gradient(ellipse at 5% 40%,rgba(237,42,73,.12),transparent 35rem),var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif}.container{width:min(900px,calc(100% - 32px));margin:auto}.top{padding:22px 0}.nav,.card{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.045);backdrop-filter:blur(18px)}.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.brand{color:var(--red);font-weight:900;text-decoration:none}.back{color:var(--muted);text-decoration:none;font-size:13px}.card{padding:24px;margin:18px 0}.profile-head{display:flex;align-items:center;gap:18px}.avatar{width:82px;height:82px;flex:0 0 82px;border-radius:24px;background:linear-gradient(135deg,#ed2a49,#d3a034);display:grid;place-items:center;font-size:30px;font-weight:900;object-fit:cover}.avatar-choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.avatar-choice{width:66px;height:66px;padding:3px;border:2px solid var(--line);border-radius:17px;background:#171717;cursor:pointer}.avatar-choice img{width:100%;height:100%;object-fit:cover;border-radius:12px}.avatar-choice.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(211,160,52,.18)}.avatar-hint{font-size:12px;color:var(--muted);margin-top:8px}.muted{color:var(--muted)}.username{direction:ltr;text-align:right;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.field{display:grid;gap:7px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#171717;color:#fff;font:inherit}.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:transparent;border:1px solid var(--line)}.status{font-size:13px;margin-top:12px;color:var(--muted)}.list-item{padding:14px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.list-item a{color:#fff;text-decoration:none;font-weight:700}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:rgba(211,160,52,.13);color:var(--gold);font-size:11px}@media(max-width:600px){.grid{grid-template-columns:1fr}.profile-head{align-items:flex-start}.card{padding:18px}}</style></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">آریامهر گرافی</a><a class="back" href="index.html">بازگشت به صفحه اصلی ←</a></div></header><main class="container"><section class="card" id="profileCard"><div class="muted">در حال بارگذاری پروفایل...</div></section><section class="card" id="settingsCard" hidden><h2>تنظیمات پروفایل</h2><div class="grid"><label class="field">نام نمایشی<input id="displayName" minlength="2" maxlength="32"></label><label class="field">وضعیت پروفایل<select id="privacy"><option value="true">عمومی</option><option value="false">خصوصی</option></select></label></div><div style="margin-top:18px"><b>انتخاب تصویر پروفایل</b><div class="avatar-choices" id="avatarChoices"><span class="muted">در حال دریافت آواتارها...</span></div><div class="avatar-hint">فقط می‌توانی یکی از آواتارهای تأییدشده سایت را انتخاب کنی.</div></div><button class="btn" id="saveProfile" style="margin-top:16px">ذخیره تغییرات</button><div class="status" id="saveStatus"></div></section><section class="card"><h2>بحث‌های ایجادشده</h2><div id="userDiscussions" class="muted">در حال بارگذاری...</div></section><section class="card"><h2>پاسخ‌های ارسال‌شده</h2><div id="userReplies" class="muted">در حال بارگذاری...</div></section></main><script>const SUPABASE_URL="https://dtndnnogjrtufjezwety.supabase.co";const SUPABASE_KEY="sb_publishable_Z3VyIdDrg5Rdrg9REKRqZw_oUSVG04a";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const params=new URLSearchParams(location.search);let sessionUser=null,profileUser=null,profileRow=null,activeAvatars=[],selectedAvatarId=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Date(v).toLocaleDateString('fa-IR'):'—';function initials(v){return String(v||'؟').trim().slice(0,1)}function showList(el,rows,kind){if(!rows?.length){el.textContent='هنوز موردی ثبت نشده است.';return;}el.innerHTML=rows.map(x=>`<div class="list-item"><a href="discussion.html?discussion=${encodeURIComponent(kind==='discussion'?x.id:x.discussion_id)}">${esc(kind==='discussion'?x.title:(x.body||'پاسخ'))}</a><div class="muted" style="font-size:12px;margin-top:5px">${date(x.created_at)}</div></div>`).join('');}async function load(){
 const {data:auth}=await db.auth.getSession();sessionUser=auth?.session?.user||null;
 const username=params.get('u');
 const card=document.getElementById('profileCard');
 let data=null,error=null;
 if(username){
  const {data:visibility,error:visibilityError}=await db.rpc('get_profile_visibility',{p_username:username});
  if(visibilityError){error=visibilityError;}
  else if(!visibility||!visibility.length){error=new Error('Profile not found');}
  else{
   const v=visibility[0];
   const owner=sessionUser?.id===v.user_id;
   if(!v.is_public&&!owner){

  let avatarMarkup = `<div class="avatar">${esc(v.avatar_initial || '؟')}</div>`;

  if(v.avatar_id){
    const av = await db
      .from('profile_avatars')
      .select('image_url')
      .eq('id',v.avatar_id)
      .eq('is_active',true)
      .maybeSingle();

    if(av.data?.image_url){
      avatarMarkup = `<img class="avatar" src="${esc(av.data.image_url)}" alt="آواتار کاربر">`;
    }
  }

  card.innerHTML = `
    <div class="profile-head">
      ${avatarMarkup}
      <div>
        <h1>این صفحه خصوصی است 🔒</h1>
        <p class="muted">صاحب این حساب، نمایش اطلاعات پروفایل و فعالیت‌های خود را محدود کرده است.</p>
      </div>
    </div>
  `;

  document.getElementById('userDiscussions').textContent='این اطلاعات خصوصی است.';
  document.getElementById('userReplies').textContent='این اطلاعات خصوصی است.';
  document.getElementById('settingsCard').hidden=true;

  return;
}
   }
   const result=await db.from('user_profiles').select('user_id,username,display_name,avatar_id,is_public,created_at').eq('user_id',v.user_id).maybeSingle();
   data=result.data;error=result.error;
  }
 }else if(sessionUser){
  const result=await db.from('user_profiles').select('user_id,username,display_name,avatar_id,is_public,created_at').eq('user_id',sessionUser.id).maybeSingle();
  data=result.data;error=result.error;
 }else{location.href='index.html#account';return;}
 if(error||!data){card.innerHTML='<h2>پروفایل در دسترس نیست</h2><p class="muted">این پروفایل وجود ندارد یا قابل دریافت نیست.</p>';document.getElementById('userDiscussions').textContent='محتوایی برای نمایش وجود ندارد.';document.getElementById('userReplies').textContent='محتوایی برای نمایش وجود ندارد.';return;}
 profileRow=data;profileUser=data.user_id;const owner=sessionUser?.id===data.user_id;
 if(!data.is_public&&!owner){card.innerHTML='<h2>این صفحه خصوصی است 🔒</h2><p class="muted">صاحب این حساب، نمایش اطلاعات پروفایل و فعالیت‌های خود را محدود کرده است.</p>';document.getElementById('userDiscussions').textContent='این اطلاعات خصوصی است.';document.getElementById('userReplies').textContent='این اطلاعات خصوصی است.';return;}
 let currentAvatar=null;if(data.avatar_id){const av=await db.from('profile_avatars').select('id,title,image_url').eq('id',data.avatar_id).eq('is_active',true).maybeSingle();currentAvatar=av.data||null;}
 const avatarMarkup=currentAvatar?.image_url?`<img class="avatar" src="${esc(currentAvatar.image_url)}" alt="آواتار ${esc(data.display_name)}">`:`<div class="avatar">${esc(initials(data.display_name))}</div>`;
 card.innerHTML=`<div class="profile-head">${avatarMarkup}<div><h1 style="margin:0 0 4px">${esc(data.display_name)}</h1><div class="username">@${esc(data.username)}</div><div class="muted" style="font-size:12px;margin-top:7px">${owner?'<span class="pill">پروفایل شما</span> ':''}${data.is_public?'پروفایل عمومی':'پروفایل خصوصی'}</div></div></div><p class="muted" style="font-size:12px;margin-top:18px">عضویت از ${date(data.created_at)}</p>`;
 if(owner){document.getElementById('settingsCard').hidden=false;document.getElementById('displayName').value=data.display_name;document.getElementById('privacy').value=String(data.is_public);selectedAvatarId=data.avatar_id??null;const avResult=await db.from('profile_avatars').select('id,title,image_url').eq('is_active',true).order('sort_order',{ascending:true});activeAvatars=avResult.data||[];const choices=document.getElementById('avatarChoices');choices.innerHTML=activeAvatars.length?activeAvatars.map(a=>`<button type="button" class="avatar-choice ${Number(a.id)===Number(selectedAvatarId)?'selected':''}" data-avatar-id="${a.id}" title="${esc(a.title)}"><img src="${esc(a.image_url)}" alt="${esc(a.title)}"></button>`).join(''):'<span class="muted">آواتاری برای انتخاب وجود ندارد.</span>';choices.querySelectorAll('.avatar-choice').forEach(btn=>btn.addEventListener('click',()=>{selectedAvatarId=Number(btn.dataset.avatarId);choices.querySelectorAll('.avatar-choice').forEach(x=>x.classList.toggle('selected',x===btn));}));}
 const [d,r]=await Promise.all([db.from('discussions').select('id,title,created_at').eq('user_id',data.user_id).order('created_at',{ascending:false}).limit(50),db.from('discussion_replies').select('id,discussion_id,body,created_at').eq('user_id',data.user_id).order('created_at',{ascending:false}).limit(50)]);
 showList(document.getElementById('userDiscussions'),d.data,'discussion');showList(document.getElementById('userReplies'),r.data,'reply');
}
document.getElementById('saveProfile').addEventListener('click',async()=>{const btn=document.getElementById('saveProfile'),status=document.getElementById('saveStatus');const name=document.getElementById('displayName').value.trim();if(name.length<2||name.length>32){status.textContent='نام نمایشی باید بین ۲ تا ۳۲ نویسه باشد.';return;}btn.disabled=true;status.textContent='در حال ذخیره...';const {error}=await db.from('user_profiles').update({display_name:name,is_public:document.getElementById('privacy').value==='true',avatar_id:selectedAvatarId}).eq('user_id',sessionUser.id);btn.disabled=false;status.textContent=error?'ذخیره تغییرات انجام نشد: '+error.message:'تغییرات ذخیره شد.';if(!error)load();});load();if(window.lucide)lucide.createIcons();</script></body></html>
